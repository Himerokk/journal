<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал Группы</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030305;
            --accent-purple: #8b5cf6;
            --accent-cyan: #06b6d4;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-dark); 
            color: #fff; margin: 0; padding: 20px;
            overflow-x: hidden; width: 100%; box-sizing: border-box;
        }

        /* Твой неоновый фон */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            z-index: -1;
        }

        .container { width: 100%; max-width: 800px; margin: 0 auto; }

        .logo-main {
            font-weight: 900; font-size: clamp(2rem, 8vw, 3.5rem);
            background: linear-gradient(to bottom, #fff, #444);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .glass-card { 
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid var(--border);
            padding: 20px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s;
        }

        .glass-card:hover { border-color: var(--accent-purple); transform: translateY(-2px); }

        .student-info { display: flex; flex-direction: column; }
        .student-name { font-weight: 700; font-size: 1.1rem; }
        .student-id { font-size: 0.8rem; color: #888; }

        .status-pill {
            padding: 6px 12px; border-radius: 12px; font-size: 0.7rem; font-weight: 900;
            background: rgba(6, 182, 212, 0.1); color: var(--accent-cyan); border: 1px solid var(--accent-cyan);
        }

        .loader { text-align: center; padding: 50px; font-weight: 700; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="logo-main">ЖУРНАЛ</h1>
    <div id="app">
        <div class="loader">СИНХРОНИЗАЦИЯ...</div>
    </div>
</div>

<script>
    const API_URL = 'https://himer.pythonanywhere.com/api/students/';

    async function loadData() {
        const app = document.getElementById('app');
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            if (data.length === 0) {
                app.innerHTML = '<div class="loader">СТУДЕНТОВ ПОКА НЕТ</div>';
                return;
            }

            app.innerHTML = data.map(student => `
                <div class="glass-card">
                    <div class="student-info">
                        <span class="student-name">${student.name}</span>
                        <span class="student-id">ID: ${student.id}</span>
                    </div>
                    <div class="status-pill">В СПИСКЕ</div>
                </div>
            `).join('');

        } catch (e) {
            app.innerHTML = `
                <div class="loader" style="color: #ec4899;">
                    ОШИБКА СВЯЗИ С СЕРВЕРОМ<br>
                    <small style="font-size: 0.6rem; color: #888;">${e}</small>
                </div>`;
        }
    }

    loadData();
</script>
</body>
</html>
